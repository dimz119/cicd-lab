# 한 환경의 구성: DB 1개 + 앱 2개(blue, green) + 라우터 1개.
# dev / staging / production 모두 이 파일 하나를 쓴다.
# 환경마다 다른 것은 config/<env>.env의 값뿐이다.

x-app: &app
  env_file:
    - config/${APP_ENV}.env
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
    interval: 2s
    timeout: 3s
    retries: 20
  restart: unless-stopped

x-app-environment: &app-environment
  # 비밀 값은 config 파일이 아니라 배포할 때 주입한다.
  DATABASE_URL: postgresql://orders:${DB_PASSWORD}@db:5432/orders

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: orders
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-orders:not-deployed}
    environment:
      <<: *app-environment
      APP_COLOR: blue

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-orders:not-deployed}
    environment:
      <<: *app-environment
      APP_COLOR: green

  router:
    image: nginx:1.27-alpine
    ports:
      # 사용자가 들어오는 포트.
      - "${ROUTER_PORT}:80"
      # 아직 트래픽을 받지 않는 색을 미리 확인하는 포트.
      - "${PREVIEW_PORT}:8081"
    volumes:
      - ./.deploy/${APP_ENV}/nginx:/etc/nginx/conf.d:ro

volumes:
  db-data:
